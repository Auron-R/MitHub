<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Sidebar Navigation</title>
    </head>
    <body>
        <nav class="Navbar">
            <!-- Top Navigation Group -->
            <div class="NavGroup">
                <button class="Btn" data-section="home" title="Home" aria-label="Home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>

                <button class="Btn" data-section="games" title="Games" aria-label="Games">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="6" y1="12" x2="10" y2="12"></line>
                        <line x1="8" y1="10" x2="8" y2="14"></line>
                        <line x1="15" y1="13" x2="15.01" y2="13"></line>
                        <line x1="18" y1="11" x2="18.01" y2="11"></line>
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    </svg>
                </button>

                <button class="Btn" data-section="quick-update" title="Quick Update" aria-label="Quick Update">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </button>

                <button class="Btn" data-section="tools" title="Tools" aria-label="Tools">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </button>

                <button class="Btn" data-section="journal" title="Journal" aria-label="Journal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </button>
            </div>

            <!-- Bottom Navigation Group -->
            <div class="NavGroup">
                <button class="Btn" data-section="feedback" title="Feedback" aria-label="Feedback">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>

                <button class="Btn" data-section="settings" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>

            <!-- Slide-out Drawer -->
            <div class="NavDrawer">
                <div class="DrawerPanel" data-panel="home">Home</div>
                <div class="DrawerPanel" data-panel="games">Games</div>
                <div class="DrawerPanel" data-panel="quick-update">Quick Update</div>
                <div class="DrawerPanel" data-panel="tools">Tools</div>
                <div class="DrawerPanel" data-panel="journal">Journal</div>
                <div class="DrawerPanel" data-panel="feedback">Feedback</div>
                <div class="DrawerPanel" data-panel="settings">Settings</div>
            </div>
        </nav>

        <script>
            const navbar = document.querySelector('.Navbar');
            const buttons = document.querySelectorAll('.Btn[data-section]');
            const panels = document.querySelectorAll('.DrawerPanel[data-panel]');

            function openSection(section) {
                navbar.classList.add('is-open');
                panels.forEach(panel => {
                    panel.classList.toggle('is-active', panel.dataset.panel === section);
                });
            }

            buttons.forEach(btn => {
                btn.addEventListener('mouseenter', () => {
                    openSection(btn.dataset.section);
                });
                btn.addEventListener('focus', () => {
                    openSection(btn.dataset.section);
                });
            });

            navbar.addEventListener('mouseleave', () => {
                navbar.classList.remove('is-open');
                panels.forEach(panel => panel.classList.remove('is-active'));
            });
        </script>
    </body>
</html>
